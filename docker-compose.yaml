services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_PATH: ${DB_PATH:-/data/vault.db}
      NODE_ENV: production
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  relay:
    build:
      context: .
      dockerfile: Dockerfile
      target: relay
    restart: unless-stopped
    environment:
      PORT: 3000
      RELAY_DATA_DIR: ${RELAY_DATA_DIR:-/data}
      RELAY_AUTH_TOKEN: ${RELAY_AUTH_TOKEN:-}
      RELAY_MAX_ENVELOPE_BYTES: ${RELAY_MAX_ENVELOPE_BYTES:-1048576}
      NODE_ENV: production
    ports:
      - "${RELAY_PORT:-8080}:3000"
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      PORT: 5173
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  api-data:
  relay-data:
