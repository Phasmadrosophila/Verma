name: Cloudflare Deployment Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Typecheck, Lint, Test, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify relay & worker syntax
        run: |
          node --check relay/server.mjs
          node --check relay/cloudflare-relay.mjs
          node --check relay/worker.mjs
          node --check apps/web/worker.mjs
          node --check tests/relay/deployment.test.mjs
          node --check tests/relay/relay.test.mjs
          node --check tests/relay/cloudflare-relay.test.mjs

      - name: Run relay & serverless KV tests
        run: node --test tests/relay/*.test.mjs

      - name: Build shared package
        run: pnpm --filter @app/shared run build

      - name: Workspace typecheck
        run: pnpm run check

      - name: Workspace lint
        run: pnpm --filter @app/web run lint

      - name: Workspace test suite
        run: pnpm run test

      - name: Build packages & web assets
        run: pnpm run build

      - name: Upload web distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  preview-deploy:
    name: Deploy Preview (Cloudflare Workers)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref != 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # Safe secret isolation: PRs from forks / untrusted environments cannot access repository secrets
      - name: Deploy preview to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'verma-web' }}
        run: |
          # Resolve existing KV namespaces. Deployment must never create or delete storage.
          PROD_TITLE="VERMA_RELAY_KV"
          PREVIEW_TITLE="VERMA_RELAY_KV_preview"
          KV_LIST="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces")"
          if [ "$(echo "${KV_LIST}" | jq -r '.success')" != "true" ]; then
            echo "Cloudflare KV namespace lookup failed: ${KV_LIST}" >&2
            exit 1
          fi
          PROD_ID="$(echo "${KV_LIST}" | jq -r --arg t "${PROD_TITLE}" '.result[] | select(.title == $t) | .id')"
          PREVIEW_ID="$(echo "${KV_LIST}" | jq -r --arg t "${PREVIEW_TITLE}" '.result[] | select(.title == $t) | .id')"

          if [ -z "${PROD_ID}" ] || [ -z "${PREVIEW_ID}" ]; then
            echo "Failed to resolve KV namespace IDs (prod='${PROD_ID}' preview='${PREVIEW_ID}')" >&2
            exit 1
          fi

          # Ephemeral CI-only substitution; committed toml keeps placeholders
          sed -i "s/verma_relay_kv_production_id/${PROD_ID}/g; s/verma_relay_kv_preview_id/${PREVIEW_ID}/g" apps/web/wrangler.toml

          pnpm --dir apps/web exec wrangler deploy --config wrangler.toml --env preview

      - name: Skip preview deploy when secrets unavailable
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "Preview deployment skipped: Cloudflare credentials are isolated and omitted on untrusted forks."

  production-deploy:
    name: Deploy Production (Cloudflare Workers)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'verma-web' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Install deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Download web build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Deploy production to Cloudflare Workers
        run: |
          # Resolve existing KV namespaces. Deployment must never create or delete storage.
          PROD_TITLE="VERMA_RELAY_KV"
          PREVIEW_TITLE="VERMA_RELAY_KV_preview"
          KV_LIST="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces")"
          if [ "$(echo "${KV_LIST}" | jq -r '.success')" != "true" ]; then
            echo "Cloudflare KV namespace lookup failed: ${KV_LIST}" >&2
            exit 1
          fi
          PROD_ID="$(echo "${KV_LIST}" | jq -r --arg t "${PROD_TITLE}" '.result[] | select(.title == $t) | .id')"
          PREVIEW_ID="$(echo "${KV_LIST}" | jq -r --arg t "${PREVIEW_TITLE}" '.result[] | select(.title == $t) | .id')"

          if [ -z "${PROD_ID}" ] || [ -z "${PREVIEW_ID}" ]; then
            echo "Failed to resolve KV namespace IDs (prod='${PROD_ID}' preview='${PREVIEW_ID}')" >&2
            exit 1
          fi

          # Ephemeral CI-only substitution; committed toml keeps placeholders
          sed -i "s/verma_relay_kv_production_id/${PROD_ID}/g; s/verma_relay_kv_preview_id/${PREVIEW_ID}/g" apps/web/wrangler.toml

          pnpm --dir apps/web exec wrangler deploy --config wrangler.toml --name="${PROJECT_NAME}" --keep-vars
