name: Project Automation

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:

permissions:
  issues: write
  repository-projects: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize issue workflow state
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const workflowLabels = [
              'status:backlog',
              'status:ready',
              'status:in-progress',
              'status:in-review',
              'status:blocked',
              'status:done',
            ];

            const projectId = 'PVT_kwDOFC88vM4BmVxq';
            const statusFieldId = 'PVTSSF_lADOFC88vM4BmVxqzhk_NtU';
            const statusOptions = {
              'status:backlog': '38437962',
              'status:ready': 'e58bab61',
              'status:in-progress': 'abacd132',
              'status:in-review': 'b32cd763',
              'status:blocked': '4b83a7ab',
              'status:done': '54582935',
            };

            const issue = context.payload.issue;
            const pullRequest = context.payload.pull_request;

            const syncIssue = async (issueNumber, overrideStatus = null) => {
              const response = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const current = response.data;
              const labels = current.labels.map((label) => typeof label === 'string' ? label : label.name);
              const body = current.body || '';
              const blockers = [...body.matchAll(/blocked by (?:\[[^\]]+\] [^\r\n]+ )?#(\d+)/gi)].map((match) => Number(match[1]));

              let desired = overrideStatus;
              if (!desired && current.state === 'closed') {
                desired = 'status:done';
              } else if (!desired && blockers.length > 0) {
                const blockerStates = await Promise.all(blockers.map(async (number) => {
                  const blocker = await github.rest.issues.get({ owner, repo, issue_number: number });
                  return blocker.data.state;
                }));
                desired = blockerStates.every((state) => state === 'closed') ? 'status:ready' : 'status:blocked';
              } else if (!desired && labels.includes('status:in-review')) {
                desired = 'status:in-review';
              } else if (!desired && labels.includes('status:in-progress')) {
                desired = 'status:in-progress';
              } else if (!desired && labels.includes('status:ready')) {
                desired = 'status:ready';
              } else if (!desired) {
                desired = 'status:backlog';
              }

              for (const label of workflowLabels.filter((name) => name !== desired && labels.includes(name))) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
              }
              if (!labels.includes(desired)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [desired] });
              }

              const projectItems = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      projectItems(first: 20) {
                        nodes { id project { id } }
                      }
                    }
                  }
                }
              `, { owner, repo, number: issueNumber });
              const projectItem = projectItems.repository.issue.projectItems.nodes.find((item) => item.project.id === projectId);
              if (projectItem) {
                await github.graphql(`
                  mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $project,
                      itemId: $item,
                      fieldId: $field,
                      value: { singleSelectOptionId: $option }
                    }) { projectV2Item { id } }
                  }
                `, {
                  project: projectId,
                  item: projectItem.id,
                   field: statusFieldId,
                   option: statusOptions[desired],
                });
              }
              return current;
            };

            if (pullRequest) {
              const body = pullRequest.body || '';
              const linkedIssues = [...body.matchAll(/(?:closes|close|closed|fixes|fix|fixed|resolves|resolve|resolved)\s+#(\d+)/gi)]
                .map((match) => Number(match[1]));
              if (linkedIssues.length === 0) {
                core.info('Pull request has no linked task issue.');
                return;
              }
              const desired = context.payload.action === 'closed'
                ? (pullRequest.merged ? 'status:done' : 'status:ready')
                 : (pullRequest.draft ? 'status:in-progress' : 'status:in-review');
              for (const issueNumber of linkedIssues) {
                await syncIssue(issueNumber, desired);
              }
              return;
            }

            if (!issue) {
              const allIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              for (const openIssue of allIssues) {
                await syncIssue(openIssue.number);
              }
              core.info(`Reconciled ${allIssues.length} open issues.`);
              return;
            }

            const current = await github.rest.issues.get({ owner, repo, issue_number: issue.number }).then((response) => response.data);
            await syncIssue(current.number);

            if (context.payload.action === 'closed') {
              const dependentIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              for (const dependent of dependentIssues) {
                if (dependent.body && new RegExp(`blocked by (?:\\[[^\\]]+\\] [^\\r\\n]+ )?#${current.number}(\\D|$)`, 'i').test(dependent.body)) {
                  core.info(`Re-evaluating dependent issue #${dependent.number}.`);
                  await syncIssue(dependent.number);
                }
              }
            }
