# Cloudflare Pages Wrangler Configuration for Verma Web Frontend & Serverless Relay
name = "verma-web"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Cloudflare KV binding for serverless opaque envelope relay
[[kv_namespaces]]
binding = "VERMA_RELAY_KV"
id = "verma_relay_kv_production_id"
preview_id = "verma_relay_kv_preview_id"

[vars]
RELAY_MAX_ENVELOPE_BYTES = "1048576"
