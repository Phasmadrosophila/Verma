services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      RELAY_DATA_DIR: /data
      RELAY_MAX_ENVELOPE_BYTES: ${RELAY_MAX_ENVELOPE_BYTES:-1048576}
    ports:
      - "${RELAY_PORT:-8080}:3000"
    volumes:
      - relay-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  relay-data:
